# Nightly build channel: checks the organization mirror out with its component submodules and
# publishes Audiosurf-Tweaker-Nightly-<yyyyMMdd>.zip as a pre-release.
#
# The Nightly repository has no code, so this file lives there; the source copy is
# Tools/ReleaseChannel/nightly.yml in the main repository. Keep the two identical.
name: Nightly

on:
  repository_dispatch:
    types: [nightly]
  workflow_dispatch:
    inputs:
      ref:
        description: Mirror ref to build (default main)
        default: main

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    # The plugin needs the Quest3D SDK and the DirectX June 2010 SDK. The default hosted runner
    # builds everything except TweakerPlugin.dll; set the repository variable NIGHTLY_RUNNER to a
    # self-hosted runner that has them for a complete nightly.
    runs-on: ${{ vars.NIGHTLY_RUNNER || 'windows-latest' }}
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v4
        with:
          repository: Audiosurf-Tweaker/Audiosurf-Tweaker
          ref: ${{ inputs.ref || 'main' }}
          path: tweaker
          fetch-depth: 0
          submodules: false

      - name: Initialize the public submodules
        # Recursive covers the native dependencies too (Detours, LuaJIT, DirectX SDK). Harness and
        # the Quest3D SDK are update = none, so this leaves them for the steps that own them.
        run: git -C tweaker submodule update --init --recursive

      - name: Mint a token for the private Quest3D SDK
        id: quest3d
        if: vars.QUEST3D_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.QUEST3D_APP_ID }}
          private-key: ${{ secrets.QUEST3D_APP_PRIVATE_KEY }}
          owner: Audiosurf-Tweaker
          repositories: Quest3D-SDK

      - name: Initialize the private Quest3D SDK (when configured)
        shell: pwsh
        env:
          QUEST3D_TOKEN: ${{ steps.quest3d.outputs.token }}
        run: ./tweaker/Tools/ReleaseChannel/init-sdk.ps1 -RepositoryRoot tweaker

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the nightly bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\tweaker\Scripts\Deploy.ps1
          if ($LASTEXITCODE -ne 0) { throw "Deploy.ps1 failed" }

      - name: Check the plugin is in the bundle
        if: steps.quest3d.outputs.token != ''
        shell: pwsh
        run: |
          $dll = "tweaker\distr\TweakerUI\PluginPayload\channels\TweakerPlugin.dll"
          if (-not (Test-Path $dll)) {
            throw "Quest3D SDK was configured but TweakerPlugin.dll is missing - the native build failed"
          }
          Get-Item $dll | Select-Object FullName, Length

      - name: Pack
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          $zip = "Audiosurf-Tweaker-Nightly-$date.zip"
          Compress-Archive -Path tweaker\distr\* -DestinationPath $zip -Force
          "NIGHTLY_DATE=$date" >> $env:GITHUB_ENV
          "NIGHTLY_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish the pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ inputs.ref || 'main' }}
        run: |
          $tag = "nightly-$env:NIGHTLY_DATE-$env:GITHUB_RUN_NUMBER"
          gh release create $tag $env:NIGHTLY_ZIP --repo $env:GITHUB_REPOSITORY `
            --title "Nightly $env:NIGHTLY_DATE ($env:BUILD_REF)" --prerelease --generate-notes
