<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- An empty grid with a tick through it: the board is clear. Drawn as an outline rather than
       filled cells, because a filled grid reads as "full", which is the opposite of the feat. -->
  <g fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2.5" />
    <path d="M7.5 12.3 10.8 15.6 16.8 8.8" />
  </g>
</svg>
